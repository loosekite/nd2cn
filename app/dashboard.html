<!DOCTYPE html>
<html lang="zh-CN">
<!--
    nd2cn Track Dash  (赛道仪表)
    Track-day dashboard for the Mazda MX-5 ND2 infotainment unit (CMU, 800x480).

    Runs inside Opera Presto 12: ES5 only, no flexbox, no webfonts
    (opera.ini has "Enable Webfonts=0"; "Tipperary" is a system font).
    Shown by dashboard-loader.js in an iframe below the 64 px status bar, so
    the page itself is 800x416.

    The panel is 7 inches at ~133 dpi and is read at arm's length in a moving
    car, so this is a glance instrument: nothing read while driving is under 18 px (20 px
    for Chinese), state is carried by thick blocks of colour, and the only
    text on a gauge is the "1g" that names the ring of the friction circle.

    What is shown, and how large, follows from two things. One: the cluster
    in front of the driver already has a large tachometer, a speedometer and
    a coolant gauge without figures, so speed and engine speed are small
    here, and the large places go to what the cluster lacks. Two: only what
    the car really delivers on this firmware is shown (see "Data" below).
    The brake pressure is there, but in a unit nobody knows yet: its bar
    shows it against the highest pressure seen on this car, so a full bar
    means "as hard as you have ever braked". Outside and intake temperature,
    fuel level and yaw rate are there too, with scales still unknown: they
    are only in the calibration panel, as raw numbers, until they are
    checked against the cluster.

    Two views, chosen automatically from the driving state. Each one shows
    everything its situation needs, so that no input is ever required to find
    a value:
        ROAD     everyday driving, warming up, the pit lane: coolant in
                 degrees, huge, with its state in a word (COLD / WARMING /
                 NORMAL / HOT / OVERHEAT), the gear, engine speed and speed
                 as small figures, the engine speed bar; in the strip the
                 session timer and the session's peak g
        TRACK    above 0.55 g or 5500 r/min for 0.8 s; left again after 12 s
                 below 0.3 g and 4000 r/min. Friction circle with trail and
                 peak marks, the pedals right beside it (brake red, throttle
                 green), g now and peak g; the engine speed bar (it flashes
                 at the shift speed), the gear, coolant in degrees with its
                 word, engine speed and speed small; in the strip GPS speed,
                 steering angle, session timer

    Warnings (oil pressure, charging, coolant above 112 C) take over the
    bottom strip as red blocks in every view and light a red bar along the top
    edge. They blink at 1 Hz for five seconds, then stay lit. Oil and charging
    are ignored while the engine is known to be stopped, when both lamps are
    lit on any car. Nothing on this page flashes faster than 3 Hz.

    Data: /tmp/nd2cn/dashboard.json, written 10 times a second by nd2cn-dashd
    (or 5 to 6 times by its fallback, dashboard-daemon.sh). nd2cn-dashd also
    pushes every sample over a WebSocket on 127.0.0.1 (the port is in the
    file as "ws"); the page takes that when it can and polls the file
    otherwise. The page draws 30 frames a second. Every value may be null, and two of them matter on
    firmware 74.00.324A: "ambient" is always null (the outside temperature
    the database holds comes raw, as "out"); coolant is not on
    D-Bus and is read from the shared memory database every 2 s. Should that
    fail, coolant shows "--" and no state word, and the over-temperature
    warning cannot fire; everything else carries on. The gear comes as
    "gear" (manual), "lever" (automatic) and "gearbox", see gearText(). After 0.6 s without a new
    sample the values turn grey (NO DATA), after 2 s they are blanked
    (OFFLINE). The page never writes anything anywhere; all state lives in
    memory and is gone at power-off.

    URL options (after #, separated by &):
        demo        synthetic data, no daemon needed (bench testing)
        raw         open the calibration panel at start
        view=track  start locked in one view (road | track)
        alert       with demo: show the warning blocks
        lang=zh_CN  force the label language (normally taken from the system)
        data=URL    read the JSON from another URL
        ws=0        poll the file only, even where the daemon pushes
        conf=URL    read the settings (shift beep) from another file

    Controls. Every commander input has one meaning in every state, so it can
    be worked without looking. Touch does the same things.
        rotate          / swipe left-right    next / previous view, locked
        tilt up                               TRACK view, now, locked
        tilt down       / tap the status cell back to automatic
        press           / tap timer            start / pause the timer
        press twice     / double-tap timer     reset timer and peak g (within 0.5 s)
        Back            / tap  <              close
        tilt left-right / tap the status cell calibration panel on / off;
                          (while automatic)   it only opens standing still;
                                              opening it sounds the shift beep once

    Shift beep (manual gearbox): one beep of the unit's own, a moment before
    the engine speed to shift at, see CFG.shiftRpm12 and shiftCheck().
-->
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Track Dash</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 800px; height: 416px;
    overflow: hidden;
    background: #050707;
}
body {
    color: #ffffff;
    font-family: "Tipperary", Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1;
    cursor: default;
}
#app {
    position: absolute; left: 0; top: 0;
    width: 800px; height: 416px;
    overflow: hidden;
    /* the factory wallpaper, shifted up by the status bar height */
    background: #050707 url("file:///jci/gui/common/images/background.png") 0 -64px no-repeat;
}
#veil  { position: absolute; left: 0; top: 0; width: 800px; height: 416px; background: rgba(4, 7, 7, 0.62); }
#strip { position: absolute; left: 0; top: 336px; width: 800px; height: 78px;
         background: rgba(0, 0, 0, 0.46); border-top: 2px solid rgba(255, 255, 255, 0.10); }
#app div, #app span, #app canvas { position: absolute; }
#app span.s, #app span.d, #app span.p, #app span.al { position: static; }

/* which view shows what: vT = track, vR = road */
#app .vT, #app .vR { display: none; }
#app.m-track .vT, #app.m-road .vR { display: block; }

/* section label. Chinese is set larger than English: a hanzi has more strokes
   than a capital letter and needs the extra pixels at the same distance. */
.lb { height: 24px; line-height: 24px; font-size: 20px; letter-spacing: 2px; color: #b4b7ba; white-space: nowrap; }
.en .lb { font-size: 18px; }

/* numbers: every glyph sits in a fixed-width cell (tabular figures) */
.num  { white-space: nowrap; font-weight: bold; }
.d    { display: inline-block; width: 0.58em; text-align: center; }
.p    { display: inline-block; width: 0.32em; text-align: center; }
.unit { font-size: 18px; font-weight: normal; color: #b4b7ba; letter-spacing: 1px; white-space: nowrap; margin-left: 6px; }

.cWhite { color: #ffffff; }
.cDim   { color: #55585a; }
.cCold  { color: #5aa8ff; }
.cAmber { color: #f89c1e; }
.cGreen { color: #3ecf6e; }
.cRed   { color: #ff2801; }

/* Samples stopped arriving (but not yet for long enough to blank the
   screen): what is shown is old, so it loses its white. */
#app.stale #spdV, #app.stale #rpmV, #app.stale #gearV, #app.stale #coolV,
#app.stale #gTotV, #app.stale #gpsV, #app.stale #stV, #app.stale #thrV { color: #7d8083; }

/* ── friction circle ── */
#gBg, #gFg { left: 12px; top: 4px; }
#gTot  { left: 16px; top: 266px; width: 170px; height: 60px; white-space: nowrap; }
#gTotV { font-size: 56px; line-height: 60px; }
#gTot .unit { font-size: 24px; }
#gMaxL { left: 222px; top: 266px; width: 120px; text-align: right; }
#gMax  { left: 222px; top: 291px; width: 120px; height: 34px; text-align: right; font-size: 32px; line-height: 34px; }

/* ── pedals: right beside the circle, so that what the feet do and what
      the car does with it are read in one glance ── */
#ped   { left: 284px; top: 14px; }
/* throttle in per cent, under the two bars (the brake pressure has no known unit: no number) */
#thrBox { left: 274px; top: 240px; width: 78px; height: 24px; text-align: center; white-space: nowrap; }
#thrV   { font-size: 22px; line-height: 24px; }
#thrBox .unit { font-size: 14px; margin-left: 2px; }

/* What goes where. The instrument cluster in front of the driver already
   has a large tachometer, a speedometer and a coolant gauge without
   figures; this screen sits further from the line of sight. So the large
   places go to what the cluster lacks or only hints at (g, pedals,
   steering, coolant in degrees, the timer) and to what is read from the
   corner of the eye (the engine speed bar with its shift flash, the gear).
   Speed and engine speed are there as small figures, for reference.

   TRACK (the base rules): friction circle and pedals on the left; on the
   right the engine speed bar across the top, then two columns: the gear
   (with a manual gearbox the driver knows it: no larger than the rest) over
   engine speed, and coolant in degrees over speed. */

/* ── engine speed bar: top right (track), under the gear (road) ── */
#rpm { left: 360px; top: 14px; }

/* ── gear ── */
#gearBox { left: 360px; top: 72px; width: 132px; height: 160px; background: rgba(255, 255, 255, 0.07); }
#gearL   { left: 0; top: 8px; width: 132px; text-align: center; text-indent: 2px; }
#gearV   { left: 0; top: 40px; width: 132px; height: 104px; text-align: center;
           font-size: 88px; line-height: 104px; font-weight: bold; }
#gearAcc { left: 0; top: 154px; width: 132px; height: 6px; background: #55585a; }

/* ── coolant: degrees, the word for it, the bar ── */
#coolL { left: 512px; top: 72px; }
#coolS { left: 600px; top: 70px; width: 184px; height: 28px; text-align: right;
         font-size: 22px; line-height: 28px; font-weight: bold; letter-spacing: 2px; white-space: nowrap; }
#coolBox { left: 510px; top: 98px; width: 274px; height: 104px; text-align: left; white-space: nowrap; }
#coolV   { font-size: 96px; line-height: 104px; }
#coolBox .unit { font-size: 26px; }
#cool  { left: 512px; top: 206px; }
.en #coolS { font-size: 20px; letter-spacing: 1px; }     /* "OVERHEAT" beside "COOLANT" */

/* ── engine speed and speed, small: the cluster has both ── */
#rpmL  { left: 360px; top: 248px; }
#rpmBox  { left: 360px; top: 274px; width: 140px; height: 50px; white-space: nowrap; }
#rpmV    { font-size: 44px; line-height: 50px; }
#rpmBox .unit { display: none; }               /* no room, and the label says it */
#spdL { left: 512px; top: 248px; }
/* whole km/h, the tenth smaller on the same baseline */
#spdV { left: 512px; top: 274px; width: 200px; height: 50px; text-align: left;
        font-size: 44px; line-height: 50px; }
#spdF { font-size: 28px; }

/* ── bottom strip ── */
.cell { top: 336px; height: 80px; }
.cl   { left: 0; top: 10px; }
.cv   { left: 0; top: 38px; height: 36px; font-size: 32px; line-height: 36px; white-space: nowrap; }
#sesCell { left: 504px; width: 150px; }
#stDot { left: 0; top: 16px; width: 12px; height: 12px; background: #55585a; }
#stTxt { left: 22px; top: 10px; height: 24px; font-size: 18px; line-height: 24px; letter-spacing: 2px; color: #ffffff; white-space: nowrap; }
#stSub { left: 22px; top: 40px; height: 24px; font-size: 18px; line-height: 24px; color: #b4b7ba; white-space: nowrap; }
.zh #stTxt, .zh #stSub { font-size: 20px; }
#lockC { left: -2px; top: 41px; display: none; }

/* ── calibration panel (used parked, so it may be denser) ── */
#raw  { left: 8px; top: 4px; width: 340px; height: 330px; display: none; background: #070a0a; }
#rawT { left: 10px; top: 6px; color: #ffffff; }
.rr { left: 10px; width: 320px; height: 14px; font-size: 14px; line-height: 14px; }
.rn { left: 0; color: #b4b7ba; white-space: nowrap; }
.ra { left: 118px; width: 80px; text-align: right; color: #c8c8c8; white-space: nowrap; }
.rb { left: 202px; width: 118px; text-align: right; color: #ffffff; white-space: nowrap; }


/* ── view change: a short dip to dark instead of a hard cut ── */
#fade { left: 0; top: 0; width: 800px; height: 336px; display: none; background: #050707; }

/* ── warnings: red blocks that take over the bottom strip in every view,
      plus a red bar along the top edge, the part of the screen closest to
      the road. They never cover speed, gear or the rpm bar; what they do
      cover (GPS speed, steering, timer) does not matter while one is up. ── */
#alTop  { left: 0; top: 0; width: 800px; height: 10px; display: none; background: #ff2801; }
#alerts { left: 76px; top: 338px; width: 572px; height: 78px; padding-left: 8px; display: none;
          background: #050707; white-space: nowrap; }
.al { display: none; vertical-align: top; margin: 9px 8px 0 0; height: 60px; padding: 0 20px;
      background: #ff2801; color: #ffffff;
      font-size: 30px; line-height: 60px; font-weight: bold; letter-spacing: 3px; }

/* ── feedback for the commander: also in the strip, never over the gauges ── */
#toast { left: 344px; top: 346px; width: 310px; height: 62px; display: none;
         background: #0b3a45; color: #ffffff; font-weight: bold;
         text-align: center; font-size: 22px; line-height: 62px; letter-spacing: 2px; white-space: nowrap; }
#toast.ask { background: #f89c1e; color: #140d02; }

/* ── ROAD: everyday driving, warming up, the pit lane. Coolant in degrees
      is the one thing here the cluster cannot say, so it is the large
      figure; the gear beside it, engine speed and speed small, the engine
      speed bar under them. The strip holds what one looks at after a
      session. ── */
.m-road #coolL   { left: 44px; top: 24px; }
.m-road #coolBox { left: 40px; top: 52px; width: 420px; height: 190px; }
.m-road #coolV   { font-size: 180px; line-height: 190px; }
.m-road #coolBox .unit { font-size: 32px; margin-left: 10px; }
.m-road #cool    { left: 44px; top: 258px; }
.m-road #coolS   { left: 220px; top: 22px; width: 220px; font-size: 24px; }
.m-road #gearBox { left: 480px; top: 24px; width: 132px; height: 212px; }
.m-road #gearL   { width: 132px; top: 10px; }
.m-road #gearV   { width: 132px; top: 44px; height: 150px; font-size: 140px; line-height: 150px; }
.m-road #gearAcc { width: 132px; top: 206px; }
.m-road #rpmL    { left: 636px; top: 24px; }
.m-road #rpmBox  { left: 634px; top: 50px; width: 150px; height: 56px; }
.m-road #rpmV    { font-size: 52px; line-height: 56px; }
.m-road #spdL    { left: 636px; top: 134px; }
.m-road #spdV    { left: 634px; top: 160px; width: 150px; height: 56px; font-size: 52px; line-height: 56px; }
.m-road #spdF    { font-size: 32px; }
.m-road #rpm     { left: 480px; top: 258px; }
.m-road #sesCell { left: 84px; }
</style>
</head>
<body>
<div id="app">
    <div id="veil"></div>
    <div id="strip"></div>

    <!-- ── left: friction circle ── -->
    <canvas id="gBg" class="vT" width="260" height="260"></canvas>
    <canvas id="gFg" class="vT" width="260" height="260"></canvas>
    <div id="gTot" class="vT"><span id="gTotV" class="num s"></span><span class="unit s">g</span></div>
    <div id="gMaxL" class="lb vT" data-l="max"></div>
    <div id="gMax" class="num vT"></div>

    <!-- ── engine speed bar (every view) ── -->
    <canvas id="rpm" width="424" height="44"></canvas>

    <!-- ── speed (small), gear, pedals ── -->
    <div id="spdL" class="lb" data-l="speed"></div>
    <div id="spdV" class="num"><span id="spdI" class="s"></span><span id="spdF" class="s"></span></div>

    <div id="gearBox">
        <div id="gearL" class="lb" data-l="gear"></div>
        <div id="gearV"></div>
        <div id="gearAcc"></div>
    </div>

    <canvas id="ped" class="vT" width="58" height="250"></canvas>
    <div id="thrBox" class="vT"><span id="thrV" class="num s"></span><span class="unit s">%</span></div>

    <!-- ── rpm number, coolant ── -->
    <div id="rpmL" class="lb" data-l="rpm"></div>
    <div id="rpmBox"><span id="rpmV" class="num s"></span><span class="unit s">r/min</span></div>

    <div id="coolL" class="lb" data-l="cool"></div>
    <div id="coolS"></div>
    <div id="coolBox"><span id="coolV" class="num s"></span><span class="unit s">&deg;C</span></div>
    <canvas id="cool" width="212" height="26"></canvas>

    <!-- ── bottom strip ── -->
    <canvas id="back" class="cell" width="64" height="80" style="left:0"></canvas>

    <div class="cell vT" style="left:84px;width:200px">
        <div class="lb cl" data-l="gps"></div>
        <div class="cv"><span id="gpsV" class="num s"></span><span class="unit s">km/h</span></div>
    </div>

    <div class="cell vT" id="stBox" style="left:296px;width:196px;visibility:hidden">
        <div class="lb cl" data-l="steer"></div>
        <div class="cv"><span id="stV" class="num s"></span></div>
        <canvas id="stC" width="96" height="24" style="left:100px;top:10px"></canvas>
    </div>

    <div class="cell" id="sesCell">
        <div class="lb cl" data-l="ses"></div>
        <div class="cv"><span id="sesV" class="num s"></span></div>
    </div>

    <div class="cell vR" style="left:296px;width:196px">
        <div class="lb cl" data-l="peakg"></div>
        <div class="cv"><span id="pkV" class="num s"></span><span class="unit s">g</span></div>
    </div>

    <div class="cell" id="stCell" style="left:664px;width:136px">
        <div id="stDot"></div>
        <div id="stTxt"></div>
        <canvas id="lockC" width="16" height="20"></canvas>
        <div id="stSub"></div>
    </div>

    <div id="fade"></div>

    <div id="alTop"></div>
    <div id="alerts"><span id="alOil" class="al"></span><span id="alBat" class="al"></span><span id="alTmp" class="al"></span></div>

    <!-- ── calibration panel (hidden) ── -->
    <div id="raw">
        <div class="lb" id="rawT" data-l="raw"></div>
        <div id="rawRows" style="left:0;top:34px;width:340px;height:296px"></div>
    </div>

    <div id="toast"></div>
</div>

<script type="text/javascript">
(function () {
    var W = window, D = document;

    // ─────────────────────────────────────────────────────────────
    // Configuration
    // ─────────────────────────────────────────────────────────────
    var CFG = {
        dataUrl:    "file:///tmp/nd2cn/dashboard.json",
        pollMs:     40,      // data poll period (the car sends 10 frames a second)
        ws:         true,    // take the samples the native daemon pushes (WebSocket); "#ws=0": poll only
        softMs:     600,     // no new sample for this long -> values turn grey
        staleMs:    2000,    // ... and for this long -> OFFLINE, values blank

        rpmMax:     8000,    // right end of the bar
        rpmAmber:   6000,    // blocks from here up are amber
        rpmRed:     7000,    // blocks from here up are red
        rpmWarn:    6500,    // the whole bar turns amber
                             // (the whole bar flashes red at the shift speed, below)
        rpmFlashMs: 170,     // half period of that flash. Keeps it under three
                             // flashes a second, the limit for large flashing
                             // areas (and for red in particular)

        // Shift beep (manual gearbox). On the ND2 2.0 a gear pulls harder
        // than the next one all the way to its limiter (wheel torque from a
        // stock car's dyno run times the gear ratios: 1.04 to 1.4 times at
        // the limiter), so the speed to shift at is the limiter less a
        // margin, not a point on the torque curve. The limiter is 7500 r/min
        // in 1st and 2nd and 7200 from 3rd up (Mazda, via Flyin' Miata;
        // actual engine speed, which is what the car reports here; the
        // needle may read 300 more up there).
        // The beep comes early by shiftLeadMs, counted in engine speed at the
        // rate it is climbing: flat out in 1st (2300 r/min a second) that is
        // 1000 r/min early, in 4th 70. /data/nd2cn/dashboard.conf may set
        // SHIFT_BEEP (long | short | off), SHIFT_RPM_12, SHIFT_RPM,
        // SHIFT_LEAD_MS, SHIFT_COLD_C (0 = off) and SHIFT_COLD_RPM.
        shiftTone:    "long",  // which of the unit's two beeps; "off": none
        shiftRpm12:   7400,    // shift speed in 1st and 2nd
        shiftRpm:     7100,    // ... from 3rd up, and where the bar flashes when the gear is not known
        shiftLeadMs:  450,     // reaction time, and the way here
        shiftColdC:   60,      // coolant below this:
        shiftColdRpm: 4500,    // ... beep here instead (the bar does not flash)
        confUrl:    "file:///data/nd2cn/dashboard.conf",

        // Brake pressure (nd2cn-dashd "brake_p": BrakePressure from the
        // database, unit unknown). Zero is what it reads released ("brake_p0",
        // 152 on the car); a full bar is the highest pressure ever held on
        // this car ("brake_pmax", kept by the daemon across power-off), and
        // at least brakeSpan above zero, so that the first drives do not
        // fill it with every light touch (the car: a firm press, not full
        // force, read 393, i.e. 241 above zero). BRAKE_FULL in
        // /data/nd2cn/dashboard.conf fixes the full bar at a raw value.
        brakeZero:  152,     // zero until the daemon has learnt it
        brakeSpan:  400,     // smallest full bar, above zero
        brakeDead:  6,       // noise of the released pedal (149..153 seen)
        brakeFull:  0,       // BRAKE_FULL; 0: learnt

        gRing:      1.25,    // g at the outer ring
        gClamp:     1.30,    // the dot never leaves the plate
        gBall:      true,    // true: the dot moves like a ball on the dashboard
                             //       (braking = up, right-hand corner = left)
                             // false: engineering g-g plot
                             //       (acceleration = up, right-hand corner = right)
        gSane:      2.5,     // samples above this are glitches, not peaks
        trailMs:    4000,    // length of the fading trail

        coolMin:    40,      // coolant bar range, deg C
        coolMax:    130,
        coolCold:   60,      // below: COLD
        coolReady:  80,      // below: WARMING, still blue; from here green, NORMAL
        coolWarn:   105,     // amber, HOT
        coolCrit:   112,     // red, OVERHEAT, and a warning block

        steerFull:  180,     // steering indicator full scale, degrees

        // Automatic view selection. A view change moves everything on the
        // screen, so it must not happen in ordinary traffic: a firm stop at
        // a light reaches 0.4 g and a motorway slip road 5000 r/min, hence
        // the thresholds sit above both and must hold for a moment.
        moveKmh:      5,     // moving: the calibration panel does not open
        trackG:       0.55,  // combined g that enters TRACK
        trackRpm:     5500,  // ... or this engine speed
        trackStayG:   0.3,   // lower thresholds that keep TRACK once entered
        trackStayRpm: 4000,
        trackEnterMs: 800,   // above the thresholds      -> TRACK
        trackExitMs:  12000, // below the stay thresholds -> leave TRACK; long,
                             // so the layout does not flip in a slow corner

        // warnings
        engineRpm:    400,   // below: engine not running. The oil and charge
                             // lamps are lit then on every car; not a fault.
        warnHoldMs:   1000,  // a warning must last this long before it shows
        warnBlinkMs:  5000,  // it blinks at 1 Hz this long, then stays steady

        resetArmMs:   3000,  // the second press that resets must come this soon
        doubleMs:     500,   // commander double press (resets timer and peak g)
        fadeMs:       160    // dip to dark when the view changes
    };

    // ─────────────────────────────────────────────────────────────
    // Data source, preferred: the native daemon pushes every sample over a
    // WebSocket on 127.0.0.1, the port it names in the file ("ws"). Polled,
    // a sample waited for the next read, and the read for the frame being
    // drawn: on the car 70 to 100 ms, uneven, and the playback had to run
    // 200 to 240 ms behind. Pushed, it waits for the frame only. The poll
    // stays as the fallback (shell daemon, no WebSocket, connection lost)
    // and pauses while the push delivers.
    // ─────────────────────────────────────────────────────────────
    var WS = { port: 0, key: "", sock: null, live: false, got: 0, started: 0, next: 0, wait: 2000 };
    function wsTry(now) {
        var s;
        // (a retry is never more than a minute away: one further off was
        // moved along with a clock change it was made after)
        if (WS.next > now + 60000) { WS.next = now; }
        if (!CFG.ws || OPT.demo || WS.sock || !WS.port || !W.WebSocket || now < WS.next) { return; }
        // the key ("wsk") is only in the file: what lets this page in and
        // keeps a web page out (see the daemon)
        try { s = new W.WebSocket("ws://127.0.0.1:" + WS.port + "/?k=" + WS.key); } catch (e) { s = null; }
        WS.sock = s; WS.live = false; WS.started = now;
        if (!s) { wsDrop(now); return; }
        s.onmessage = function (e) {
            var t = Date.now();
            if (WS.sock !== s) { return; }
            WS.got = t;
            if (!WS.live) { WS.live = true; WS.wait = 2000; }
            onText(String(e.data), t);
        };
        s.onclose = s.onerror = function () { if (WS.sock === s) { wsDrop(Date.now()); } };
    }
    // Gone, or never came up: back to polling, and try again later; when it
    // failed without delivering anything, each time twice as late (to 1 min).
    function wsDrop(now) {
        var s = WS.sock;
        WS.sock = null;
        if (s) {
            s.onmessage = s.onclose = s.onerror = null;
            try { s.close(); } catch (e) {}
        }
        WS.next = now + WS.wait;
        if (!WS.live) { WS.wait = Math.min(WS.wait * 2, 60000); }
        WS.live = false;
    }
    // From the poll loop. The daemon pushes at least twice a second: a
    // connection that stays silent longer, or never delivers, is given up.
    function wsCheck(now) {
        if (WS.sock && (WS.live ? (now - WS.got > 1200 || now < WS.got) : (now - WS.started > 3000 || now < WS.started))) {
            wsDrop(now);
        }
        wsTry(now);
    }

    // Synthetic lap for bench testing (#demo)
    function demoTick() {
        var t = (Date.now() - T0) / 1000, o = {}, lat, lon, spd, g, rpm, ratios;
        lat = 1.08 * Math.sin(t * 0.9) * (0.55 + 0.45 * Math.sin(t * 0.23 + 1));
        lon = 0.55 * Math.cos(t * 1.8 + 0.6) - 0.25 * Math.max(0, Math.sin(t * 0.45));
        spd = 104 + 52 * Math.sin(t * 0.33) + 6 * Math.sin(t * 1.7);
        ratios = [0, 7.97, 13.56, 19.9, 25.4, 31.5, 40.55];     // km/h per 1000 r/min
        g = spd < 48 ? 2 : (spd < 78 ? 3 : (spd < 112 ? 4 : (spd < 148 ? 5 : 6)));
        rpm = spd / ratios[g] * 1000;
        o.seq = Math.round(t * 10);
        o.t = Math.round(t * 1000) + 5000;
        o.ts = Math.round(Date.now() / 1000);
        o.speed = Math.round(spd * 10) / 10;
        o.rpm = Math.round(rpm);
        o.gear = g; o.lever = 1; o.gearbox = "mt";
        o.throttle = lon > 0 ? Math.round(clamp(lon * 190, 0, 100) * 10) / 10 : 0;
        o.brake = lon < -0.18 ? 2 : 1;                         // BCM encoding: 1 released, 2 depressed
        o.brake_p = o.brake === 2 ? Math.round(152 + (-lon - 0.1) * 1300) : 151 + Math.round(Math.random() * 2);
        o.brake_p0 = 152; o.brake_pmax = 1050;
        o.steering = Math.round(lat * 420) / 10;
        o.lat_g = Math.round(lat * 1000) / 1000;
        o.lon_g = Math.round(lon * 1000) / 1000;
        o.coolant = Math.round(93 + 5 * Math.sin(t * 0.07));
        o.gps_speed = Math.round((spd - 0.6) * 10) / 10;
        o.gps_fix = 1; o.gps_lat = 31.2304; o.gps_lon = 121.474; o.gps_heading = Math.round((t * 12) % 360 * 10) / 10;
        o.oil_warn = OPT.alert ? 1 : 0; o.batt_warn = OPT.alert ? 1 : 0;
        o.hz = 10; o.sig = Math.round(t * 60); o.src = "native"; o.smdb = "direct";
        o.wheels = [o.speed - 0.4, o.speed + 0.3, o.speed - 0.1, o.speed + 0.2];
        // raw numbers as the car sends them: unsigned, 0 g = 4000, wheel centre = 16000
        o.raw = { rpm: Math.round(rpm / 2), thr: Math.round(o.throttle * 10), steer: Math.round(o.steering * 10) + 16000,
                  latg: Math.round(lat / 0.00102) + 4000, lon: Math.round(lon / 0.00102) + 4000,
                  cool: o.coolant + 40, vss: Math.round(spd * 100), spd: Math.round(spd * 100) + 10000, gear: g, lever: 1,
                  brkp: o.brake_p, yaw: 2047 + Math.round(lat * 60), iat: 66, out: 64, fuel: 100 };
        setTimeout(function () { onSample(o, Date.now()); }, Math.random() * CFG.pollMs);
        setTimeout(demoTick, 100);
    }

    // ─────────────────────────────────────────────────────────────
    // Session state: peak g and timer. Memory only: the loader keeps it while
    // the dashboard is closed, and everything is gone at power-off.
    // ─────────────────────────────────────────────────────────────
    var PK = { l: 0, r: 0, t: 0, b: 0, tot: 0, ver: 0 };
    // Manual timer: stopped | running | paused. Starts only on user action.
    var timer = { state: "stopped", elapsed: 0, ref: 0 };
    var session = { sent: "", saveFrom: Date.now() + 1000 };
    var GS = CFG.gBall ? { x: -1, y: 1 } : { x: 1, y: -1 };   // g -> screen direction

    function trackPeaks(c) {
        var gx, gy, m, ch = false;
        if (c.lat_g === null || c.lon_g === null) { return; }
        gx = GS.x * c.lat_g; gy = GS.y * c.lon_g;
        m = Math.sqrt(gx * gx + gy * gy);
        if (m > CFG.gSane) { return; }
        if (-gx > PK.l) { PK.l = -gx; ch = true; }
        if (gx > PK.r) { PK.r = gx; ch = true; }
        if (-gy > PK.t) { PK.t = -gy; ch = true; }
        if (gy > PK.b) { PK.b = gy; ch = true; }
        if (m > PK.tot) { PK.tot = m; ch = true; }
        if (ch) { PK.ver++; }
    }
    function resetSession() {
        PK.l = PK.r = PK.t = PK.b = PK.tot = 0; PK.ver++;
        timer.state = "stopped"; timer.elapsed = 0; timer.ref = 0;
        trail.n = 0;
        toast(TXT.reset, false, 1400);
    }
    function timerToggle() {
        if (timer.state === "stopped" || timer.state === "paused") {
            timer.state = "running";
            timer.ref = Date.now();
        } else {
            timer.elapsed += Date.now() - timer.ref;
            timer.state = "paused";
        }
    }
    // Commander press / tap on the timer: start or pause it. A second press
    // within CFG.doubleMs resets the session (timer and peak g); whatever the
    // first press of the pair did to the timer no longer matters then.
    var lastSel = 0;
    function selectPress() {
        var now = Date.now();
        if (lastSel && now >= lastSel && now - lastSel < CFG.doubleMs) {
            lastSel = 0; armed = 0;
            resetSession();
            return;
        }
        lastSel = now;
        timerToggle();
    }
    function timerMs() {
        if (timer.state === "running") { return timer.elapsed + (Date.now() - timer.ref); }
        return timer.elapsed;
    }
    // mm:ss.cc; past an hour h:mm:ss, the cell has no room for both
    function timerText(ms) {
        var cs = Math.max(0, Math.floor(ms / 10)), s = Math.floor(cs / 100), h = Math.floor(s / 3600);
        if (h > 0) { return h + ":" + pad2(Math.floor(s % 3600 / 60)) + ":" + pad2(s % 60); }
        return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60) + "." + pad2(cs % 100);
    }
    function saveState() {
        var s;
        if (Date.now() < session.saveFrom) { return; }
        s = JSON.stringify({ te: timer.elapsed, ts: timer.state, p: [PK.l, PK.r, PK.t, PK.b, PK.tot], m: M.lock ? M.mode : "" });
        if (s !== session.sent) { session.sent = s; post("state:" + s); }
    }
    function loadState(text) {
        var o, p;
        try { o = JSON.parse(text); } catch (e) { return; }
        if (!o) { return; }
        if (isNum(o.te) && o.te >= 0) {
            timer.elapsed = o.te;
            timer.state = (o.ts === "running" || o.ts === "paused") ? "paused" : "stopped";
        }
        p = o.p;
        if (p && p.length === 5 && isNum(p[0]) && isNum(p[1]) && isNum(p[2]) && isNum(p[3]) && isNum(p[4])) {
            PK.l = p[0]; PK.r = p[1]; PK.t = p[2]; PK.b = p[3]; PK.tot = p[4]; PK.ver++;
        }
        if (o.m === "road" || o.m === "track") { M.lock = true; setMode(o.m); }
    }

    // ─────────────────────────────────────────────────────────────
    // Friction circle: rings at 0.5 g and 1.0 g, outer ring at 1.25 g,
    // amber peak-hold marks on the four axes, glowing trail behind the dot.
    // No text on the canvas: small anti-aliased type is unreadable here.
    // ─────────────────────────────────────────────────────────────
    var G_SIZE = 260, G_C = 130, G_PX = 96;   // canvas size, centre, pixels per g
    var gBg = $("gBg").getContext("2d");
    var gFg = $("gFg").getContext("2d");
    var gBgVer = -1;
    var TRAIL_N = 160;
    var trail = { x: [], y: [], t: [], head: 0, n: 0, lastT: 0, lx: -99, ly: -99 };
    var gState = { clean: false, dx: -99, dy: -99 };
    var quality = 2;                          // 2: glow, 1: plain trail, 0: plain trail at 15 fps

    function ring(c, g) {
        c.beginPath();
        c.arc(G_C, G_C, g * G_PX, 0, TAU, false);
        c.stroke();
    }
    function peakMark(c, dx, dy, v) {
        var r, px, py;
        if (v < 0.08) { return; }
        r = Math.min(v, CFG.gRing) * G_PX;
        px = G_C + dx * r; py = G_C + dy * r;
        c.beginPath();
        c.moveTo(px - dy * 10, py - dx * 10);
        c.lineTo(px + dy * 10, py + dx * 10);
        c.stroke();
    }
    function drawGBg() {
        var c = gBg, R = CFG.gRing * G_PX, d;
        if (gBgVer === PK.ver) { return; }
        gBgVer = PK.ver;
        c.clearRect(0, 0, G_SIZE, G_SIZE);

        c.beginPath();
        c.arc(G_C, G_C, R, 0, TAU, false);
        c.fillStyle = "rgba(255,255,255,0.06)";
        c.fill();
        c.lineWidth = 3;                           // must survive sunlight on the panel
        c.strokeStyle = "rgba(255,255,255,0.64)";
        c.stroke();

        c.lineWidth = 2;
        c.strokeStyle = "rgba(255,255,255,0.22)";
        c.beginPath();
        c.moveTo(G_C - R, G_C); c.lineTo(G_C + R, G_C);
        c.moveTo(G_C, G_C - R); c.lineTo(G_C, G_C + R);
        c.stroke();

        c.strokeStyle = "rgba(255,255,255,0.30)";
        ring(c, 0.5);
        c.strokeStyle = "rgba(255,255,255,0.44)";  // the 1 g ring is the one that is read
        ring(c, 1.0);

        // The only text on the plate: which ring is 1 g. It sits in a gap cut
        // into that ring, lower right, where the trail is rarely drawn.
        d = Math.round(0.7071 * G_PX);
        c.clearRect(G_C + d - 17, G_C + d - 12, 34, 24);
        c.fillStyle = "rgba(255,255,255,0.06)";
        c.fillRect(G_C + d - 17, G_C + d - 12, 34, 24);
        c.font = "bold 18px Tipperary, Arial, Helvetica, sans-serif";
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillStyle = C_LABEL;
        c.fillText("1g", G_C + d, G_C + d);

        c.strokeStyle = C_AMBER;
        c.lineWidth = 5;
        c.lineCap = "butt";
        peakMark(c, 0, -1, PK.t);
        peakMark(c, 0, 1, PK.b);
        peakMark(c, -1, 0, PK.l);
        peakMark(c, 1, 0, PK.r);
    }
    function trailPush(x, y, now) {
        var i, dx = x - trail.lx, dy = y - trail.ly;
        if (now - trail.lastT < 33 || dx * dx + dy * dy < 0.36) { return; }
        i = trail.head;
        trail.x[i] = x; trail.y[i] = y; trail.t[i] = now;
        trail.head = (i + 1) % TRAIL_N;
        if (trail.n < TRAIL_N) { trail.n++; }
        trail.lastT = now; trail.lx = x; trail.ly = y;
    }
    // The trail is stroked in a few alpha steps (old = faint, new = bright)
    // instead of one stroke per segment, which Presto could not afford.
    function trailStroke(c, now, width, gain, buckets, endX, endY) {
        var k, i = 0, b = -1, nb, age, px = 0, py = 0, a, started = false;
        c.lineWidth = width;
        for (k = 0; k <= trail.n; k++) {
            if (k < trail.n) {
                i = (trail.head - trail.n + k + TRAIL_N * 2) % TRAIL_N;
                age = (now - trail.t[i]) / CFG.trailMs;
            } else {
                if (endX === null) { break; }
                age = 0;                         // last segment runs to the live dot
            }
            nb = Math.floor((1 - clamp(age, 0, 0.999)) * buckets);
            if (k > 0) {
                if (nb !== b) {
                    if (started) { c.stroke(); }
                    b = nb;
                    a = (b + 1) / buckets;
                    c.strokeStyle = "rgba(60,200,232," + (a * a * gain).toFixed(3) + ")";
                    c.beginPath();
                    c.moveTo(px, py);
                    started = true;
                }
                if (k < trail.n) { c.lineTo(trail.x[i], trail.y[i]); } else { c.lineTo(endX, endY); }
            }
            if (k < trail.n) { px = trail.x[i]; py = trail.y[i]; }
        }
        if (started) { c.stroke(); }
    }
    function drawG(now) {
        var c = gFg, has = live && V.lat_g !== null && V.lon_g !== null;
        var gx, gy, m = 0, lim, x = 0, y = 0, col;

        // drop trail points that have faded out
        while (trail.n > 0 && now - trail.t[(trail.head - trail.n + TRAIL_N * 2) % TRAIL_N] > CFG.trailMs) { trail.n--; }

        if (has) {
            gx = GS.x * V.lat_g; gy = GS.y * V.lon_g;
            m = Math.sqrt(gx * gx + gy * gy);
            lim = CFG.gClamp;
            if (m > lim) { gx *= lim / m; gy *= lim / m; }
            x = G_C + gx * G_PX; y = G_C + gy * G_PX;
            trailPush(x, y, now);
        }
        if (!has && trail.n === 0) {
            if (!gState.clean) { c.clearRect(0, 0, G_SIZE, G_SIZE); gState.clean = true; }
            return;
        }
        if (has && trail.n <= 1 && !gState.clean && Math.abs(x - gState.dx) < 0.3 && Math.abs(y - gState.dy) < 0.3) {
            return;                                // parked: nothing moved
        }
        gState.clean = false;
        gState.dx = has ? x : -99; gState.dy = has ? y : -99;

        c.clearRect(0, 0, G_SIZE, G_SIZE);
        c.lineCap = "round";
        c.lineJoin = "round";
        if (trail.n > 0) {
            if (quality >= 2) { trailStroke(c, now, 13, 0.18, 6, has ? x : null, y); }
            trailStroke(c, now, 5, 0.92, quality >= 1 ? 10 : 5, has ? x : null, y);
        }
        if (has) {
            col = m >= 1.0 ? "248,156,30" : "60,200,232";
            c.fillStyle = "rgba(" + col + ",0.18)";
            c.beginPath(); c.arc(x, y, 17, 0, TAU, false); c.fill();
            c.fillStyle = "rgba(" + col + ",0.50)";
            c.beginPath(); c.arc(x, y, 11, 0, TAU, false); c.fill();
            c.fillStyle = "#ffffff";
            c.beginPath(); c.arc(x, y, 6, 0, TAU, false); c.fill();
        }
    }

    // ─────────────────────────────────────────────────────────────
    // RPM bar: 20 solid blocks of 400 r/min. White, amber from 6000, red
    // from 7000; the whole bar goes amber at 6500 and flashes red at redline.
    // The flash is bright red / dark red, never white, and slower than 3 Hz:
    // it has to be seen from the corner of the eye, not to dazzle at night.
    // ─────────────────────────────────────────────────────────────
    var rpmCtx = $("rpm").getContext("2d");
    var RPM_W = 460, RPM_H = 44, RPM_SEG = 20, rpmKey = "";   // size follows the view, see setMode()
    var shown = { rpm: 0, thr: 0, brk: 0 };

    function drawRpm(now) {
        var c = rpmCtx, rpm = shown.rpm, per = CFG.rpmMax / RPM_SEG, pitch = RPM_W / RPM_SEG;
        var zone = rpm >= shiftRpm(live ? S.cur : null) ? 2 : (rpm >= CFG.rpmWarn ? 1 : 0);
        var flash = zone === 2 ? (Math.floor(now / CFG.rpmFlashMs) % 2) : 0;
        var key = Math.round(rpm / CFG.rpmMax * RPM_W * 2) + "/" + zone + "/" + flash;
        var i, x, lo, f, lit;
        if (key === rpmKey) { return; }
        rpmKey = key;
        c.clearRect(0, 0, RPM_W, RPM_H);
        for (i = 0; i < RPM_SEG; i++) {
            x = Math.round(i * pitch);
            lo = i * per;
            c.fillStyle = lo >= CFG.rpmRed ? "rgba(255,40,1,0.34)" :
                          (lo >= CFG.rpmAmber ? "rgba(248,156,30,0.24)" : "rgba(255,255,255,0.10)");
            c.fillRect(x, 0, pitch - 3, RPM_H);
            f = clamp((rpm - lo) / per, 0, 1);
            if (f <= 0) { continue; }
            if (zone === 2) { lit = flash ? C_RED_LOW : C_RED; }
            else if (zone === 1) { lit = lo >= CFG.rpmRed ? C_RED : C_AMBER; }
            else { lit = lo >= CFG.rpmRed ? C_RED : (lo >= CFG.rpmAmber ? C_AMBER : "#f4f4f4"); }
            c.globalAlpha = f;                     // the leading block fades in
            c.fillStyle = lit;
            c.fillRect(x, 0, pitch - 3, RPM_H);
            c.globalAlpha = 1;
        }
    }

    // ─────────────────────────────────────────────────────────────
    // Pedals (brake left in red, throttle right in green, as on every data
    // trace and in the footwell), coolant block, steering
    // ─────────────────────────────────────────────────────────────
    var pedCtx = $("ped").getContext("2d"), pedKey = "";
    var PED_H = 222, PED_W = 26;                   // the canvas is 250 high; the rest is for #thrBox
    function pedBar(c, x, v, color) {
        var h = Math.round(v / 100 * PED_H);
        c.fillStyle = "rgba(255,255,255,0.10)";
        c.fillRect(x, 0, PED_W, PED_H);
        if (h > 0) {
            c.fillStyle = color;
            c.fillRect(x, PED_H - h, PED_W, h);
        }
    }
    function drawPedals() {
        var key = Math.round(shown.thr / 100 * PED_H) + "/" + Math.round(shown.brk / 100 * PED_H);
        if (key === pedKey) { return; }
        pedKey = key;
        pedCtx.clearRect(0, 0, 58, PED_H);
        pedBar(pedCtx, 0, shown.brk, C_RED);
        pedBar(pedCtx, 32, shown.thr, C_GREEN);
    }

    // One solid colour for the whole lit block: blue = not warm yet, green =
    // normal, amber = hot, blinking red = too hot. The colour is the message;
    // the same state is also spelled out next to the label.
    var coolCtx = $("cool").getContext("2d"), coolKey = "";
    var COOL_W = 212, COOL_H = 26;                             // size follows the view, see setMode()
    function coolX(t) { return (clamp(t, CFG.coolMin, CFG.coolMax) - CFG.coolMin) / (CFG.coolMax - CFG.coolMin) * COOL_W; }
    function coolLevel(t) {                                    // index into TXT.cool
        return t >= CFG.coolCrit ? 4 : (t >= CFG.coolWarn ? 3 : (t >= CFG.coolReady ? 2 : (t >= CFG.coolCold ? 1 : 0)));
    }
    var COOL_COLORS = [C_BLUE, C_BLUE, C_GREEN, C_AMBER, C_RED];
    var COOL_CLASSES = ["cCold", "cCold", "cWhite", "cAmber", "cRed"];
    function coolColor(t) { return COOL_COLORS[coolLevel(t)]; }
    function drawCool(now) {
        var c = coolCtx, t = live ? V.coolant : null, crit = t !== null && t >= CFG.coolCrit;
        // blinks together with its warning block, and stops when that does
        var pulse = (crit && AL.tmp.on && now - AL.tmp.on < CFG.warnBlinkMs) ? Math.floor(now / 500) % 2 : 0;
        var key = (t === null ? "x" : Math.round(coolX(t)) + "/" + coolColor(t)) + "/" + pulse, xw, xc;
        if (key === coolKey) { return; }
        coolKey = key;
        xw = Math.round(coolX(CFG.coolWarn)); xc = Math.round(coolX(CFG.coolCrit));
        c.clearRect(0, 0, COOL_W, COOL_H);
        c.fillStyle = "rgba(255,255,255,0.10)";
        c.fillRect(0, 0, xw, COOL_H);
        c.fillStyle = "rgba(248,156,30,0.24)";
        c.fillRect(xw, 0, xc - xw, COOL_H);
        c.fillStyle = "rgba(255,40,1,0.34)";
        c.fillRect(xc, 0, COOL_W - xc, COOL_H);
        if (t === null) { return; }
        c.fillStyle = (crit && pulse) ? C_RED_LOW : coolColor(t);
        c.fillRect(0, 0, Math.max(6, Math.round(coolX(t))), COOL_H);
    }

    var stCtx = $("stC").getContext("2d"), stKey = "";
    function drawSteer() {
        var c = stCtx, a = live ? V.steering : null, w, key;
        w = a === null ? 0 : Math.round(clamp(a / CFG.steerFull, -1, 1) * 46);
        key = (a === null ? "x" : String(w));
        if (key === stKey) { return; }
        stKey = key;
        c.clearRect(0, 0, 96, 24);
        c.fillStyle = "rgba(255,255,255,0.12)";
        c.fillRect(2, 6, 92, 12);
        if (w !== 0) {
            c.fillStyle = C_CYAN;
            if (w > 0) { c.fillRect(48, 6, w, 12); } else { c.fillRect(48 + w, 6, -w, 12); }
        }
        c.fillStyle = a === null ? C_OFF : "#ffffff";
        c.fillRect(46, 0, 4, 24);
    }

    function drawBack() {
        var c = $("back").getContext("2d");
        c.strokeStyle = "#c8c8c8";
        c.lineWidth = 4;
        c.lineCap = "square";

        }
    }
    function framePeriod() { return quality === 0 ? 2 * FRAME_MS : FRAME_MS; }
    function setLevel(l, now) {
        level = l; quality = LEVELS[l][0]; numLevel = LEVELS[l][1];
        F.ema = framePeriod(); F.slowSince = 0; F.okSince = now;
    }
    // Presto draws the canvas in software. A frame that takes longer than its
    // slot makes the next one late; when frames run late for 2.5 s, go one
    // level lighter: the numbers first (every 50 ms, then every 100 ms),
    // then the trail glow, then 15 frames a second. Whether a heavier level
    // would fit cannot be seen from frames that are on time, so it is tried:
    // after 20 s on time one level up; if that one runs late within 10 s it
    // goes back down, and the next try waits twice as long (up to 5 min).
    // (The old rule went up only above 52 frames a second, which the car
    // never reaches: one slow moment at power-on kept it low for good.)
    function adaptQuality(now, dt) {
        var p = framePeriod();
        F.ema += (dt - F.ema) * 0.05;
        fps = 1000 / Math.max(1, F.ema);
        if (F.ema > p * 1.15) {
            F.okSince = now;
            if (!F.slowSince) { F.slowSince = now; }
            if (now - F.slowSince > 2500 && level < LEVELS.length - 1) {
                if (F.probeAt && now - F.probeAt < 10000) { F.probeWait = Math.min(F.probeWait * 2, 300000); }
                F.probeAt = 0;
                setLevel(level + 1, now);
            }
        } else {
            F.slowSince = 0;
            if (F.ema > p * 1.05 || !F.okSince) { F.okSince = now; }   // only just keeping up: no room to try
            if (level > 0 && now - F.okSince > F.probeWait) {
                F.probeAt = now;
                setLevel(level - 1, now);
            }
        }
    }
    // The clock went back (it is set from GPS time once that arrives, and the
    // unit may have run fast until then). Everything that measures time from
    // a moment in the past starts again from now; the rest checks for a
    // moment that lies in the future itself.
    function clockBack(now) {
        // (moments in the future only: a screen that was offline stays offline)
        if (S.lastChange > now) { S.lastChange = now; }
        if (S.tCur > now) { S.tCur = now; }
        S.off = null; S.dw = []; S.okSince = now;
        S.hist.length = 0;
        if (S.cur) { S.cur.at = now; S.hist.push(S.cur); }
        trail.n = 0; trail.lastT = 0;
        F.slowSince = 0; F.okSince = 0; F.due = 0; F.probeAt = 0;
        S.rxT = now;
        // the push: a retry that was due soon stays due soon; a connection
        // under way or live is timed from now
        if (WS.next > now + WS.wait) { WS.next = now + WS.wait; }
        if (WS.got > now) { WS.got = now; }
        if (WS.started > now) { WS.started = now; }
    }
    // The wall clock was set: the unit starts at 1970 and gets the time from
    // GPS later, decades at once, or goes back when it ran fast. Anything that
    // counts time from a moment remembered earlier moves along with the clock,
    // or the session timer would show 56 years. (Forward, only steps of over a
    // minute count as a clock change: a page that stalled for some seconds
    // under load really lost that time.)
    function clockJump(j) {
        function mv(x) { return x ? x + j : 0; }     // 0: not set
        timer.ref += j;
        session.saveFrom += j;
        T0 += j;
        lastSel = 0; armed = 0;
        // or the data would look 56 years old: OFFLINE for a moment, the
        // push given up as silent, a level tried too early
        S.lastChange = mv(S.lastChange); S.tCur = mv(S.tCur); S.okSince = mv(S.okSince); S.rxT = mv(S.rxT);
        WS.got = mv(WS.got); WS.started = mv(WS.started); WS.next = mv(WS.next);
        F.okSince = mv(F.okSince); F.slowSince = mv(F.slowSince); F.probeAt = mv(F.probeAt);
        M.since = mv(M.since);
        AL.oil.since = mv(AL.oil.since); AL.bat.since = mv(AL.bat.since); AL.tmp.since = mv(AL.tmp.since);
    }
    function loop() {
        var now = Date.now(), p = framePeriod(), wait;
        if (rafN) {
            rafN(loop);
            // called at every refresh of the display (60 Hz: 16.7 ms); draw
            // on the one closest to the slot, i.e. every second one
            if (now < F.due - 8 && F.due - now < 2 * p) { return; }
        }
        // on time or a little late: keep the rhythm (the next wait is shorter);
        // far off (a stall, the clock was set): start it again from here
        F.due = (now - F.due > p || F.due - now > 2 * p) ? now + p : F.due + p;
        frame(now);
        if (!rafN) {
            wait = F.due - Date.now();
            W.setTimeout(loop, wait > 1 ? wait : 1);    // at least 1 ms: the data gets its turn
        }
    }
    function frame(now) {
        var dt = F.last ? now - F.last : FRAME_MS, state;
        if (F.last && (dt < 0 || dt > 60000)) { clockJump(dt - FRAME_MS); }
        if (dt < 0 || S.lastChange > now) { clockBack(now); }
        if (dt < 0 || dt > 1000) { dt = FRAME_MS; }   // clock jumped (GPS time sync)
        F.last = now;
        // dt: from the start of the frame before to the start of this one,
        // i.e. what the frame before cost (script and painting) or its slot,
        // whichever is longer
        adaptQuality(now, dt);

        if (!S.cur) {
            state = (now - T0 < 2500) ? "wait" : "offline";
        } else if (now - S.lastChange > CFG.staleMs) {
            state = "offline";
        } else if (S.cur.idle) {
            state = "idle";
        } else {
            // the daemon writes 10 times a second; half a second of silence
            // means the numbers on screen can no longer be trusted
            state = now - S.lastChange > CFG.softMs ? "stale" : "live";
        }
        live = state === "live" || state === "stale";
        if (stale !== (state === "stale")) { stale = state === "stale"; appClass(); }
        // The playback delay follows what the samples need, but slowly: the
        // motion runs a little slower or faster for a moment, never backwards.
        S.delay += clamp(S.per + S.late + 5 - S.delay, -0.1 * dt, 0.3 * dt);
        if (live) { interpolate(now, V); }

        follow("rpm", live ? V.rpm : null, dt);
        follow("thr", live ? V.throttle : null, dt);
        follow("brk", live ? V.brake : null, dt);

        autoMode(now);
        fadeStep(now);
        if (M.mode === "track") {
            // the calibration panel covers the friction circle: no use drawing it
            if (!rawOn) { drawGBg(); drawG(now); }
            drawPedals();
            drawSteer();
        }
        drawRpm(now);
        drawCool(now);

        if (now - F.fast >= 50 || now < F.fast) { F.fast = now; updateFast(); updateAlerts(now); }
        if (now - F.med >= numLevel * 50 || now < F.med) { F.med = now; updateNums(); }
        if (now - F.slow >= 250 || now < F.slow) { F.slow = now; updateSlow(now, state); }
        // a running timer ticks every frame (hundredths); setDigits only
        // touches the characters that changed
        else if (timer.state === "running") { setDigits(el.ses, timerText(timerMs())); }
    }

    // ─────────────────────────────────────────────────────────────
    // Input
    // ─────────────────────────────────────────────────────────────
    // Every input has one meaning, whatever the state, so the commander can
    // be worked without looking at the screen.
    function onKey(k) {
        if (k === "select") { selectPress(); }
        else if (k === "cw") { cycleMode(1); }
        else if (k === "ccw") { cycleMode(-1); }
        else if (k === "up") { jumpTo("track"); }
        else if (k === "down") { unlock(); }
        else if (k === "left" || k === "right") { toggleRaw(); }
    }
    W.addEventListener("message", function (e) {
        var d = e ? e.data : null;
        if (typeof d !== "string" || d.indexOf("nd2cn-dash:") !== 0) { return; }
        d = d.substring(11);
        if (d.indexOf("key:") === 0) { onKey(d.substring(4)); }
        else if (d.indexOf("init:") === 0) { loadState(d.substring(5)); }
    }, false);

    // Touch mirrors the commander.
    //   swipe left / right   next / previous view, locked   = commander rotate
    //   tap  <               close                          = commander Back
    //   tap status cell      locked: back to automatic      = commander tilt down
    //                        automatic: calibration         = commander tilt left / right
    //   tap the panel        close it
    //   tap timer            start / pause, twice: reset   = commander press
    //   tap anywhere else    reset timer and peaks (asks first)
    (function () {
        var downX = null;
        function tap(n) {
            var id;
            while (n && n !== app) {
                id = n.id;
                if (id === "back") {
                    if (W.parent && W.parent !== W) { post("close"); }
                    else { try { W.history.back(); } catch (err) {} }
                    return;
                }
                if (id === "sesCell" || id === "sesV") { selectPress(); return; }
                if (id === "stCell" && M.lock) { unlock(); return; }
                if (id === "stCell" || id === "raw") { toggleRaw(); return; }
                n = n.parentNode;
            }
            press();
        }
        app.onmousedown = function (e) { downX = (e || W.event).clientX; };
        app.onmouseup = function (e) {
            var ev = e || W.event, dx;
            if (downX === null) { return; }
            dx = ev.clientX - downX;
            downX = null;
            if (dx <= -60) { cycleMode(1); }
            else if (dx >= 60) { cycleMode(-1); }
            else { tap(ev.target || ev.srcElement); }
        };
    })();
    D.onselectstart = function () { return false; };

    // ─────────────────────────────────────────────────────────────
    // Start
    // ─────────────────────────────────────────────────────────────
    applyLabels();
    V = blank();
    setMode("road");
    if (OPT.view === "road" || OPT.view === "track") { M.lock = true; setMode(OPT.view); }
    AL.oil.el.textContent = TXT.oil;
    AL.bat.el.textContent = TXT.batt;
    drawBack();
    drawLock();
    if (OPT.raw) { toggleRaw(true); }
    updateFast();
    updateNums();
    updateAlerts(Date.now());
    updateSlow(Date.now(), "wait");
    loadConf();
    if (OPT.demo) { demoTick(); } else { poll(); }
    loop();
    post("ready");
})();
</script>
</body>
</html>
