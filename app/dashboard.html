<!DOCTYPE html>
<html lang="zh-CN">
<!--
    nd2cn Track Dash  (赛道仪表)
    Track-day dashboard for the Mazda MX-5 ND2 infotainment unit (CMU, 800x480).

    Runs inside Opera Presto 12: ES5 only, no flexbox, no webfonts
    (opera.ini has "Enable Webfonts=0"; "Tipperary" is a system font).
    Shown by dashboard-loader.js in an iframe below the 64 px status bar, so
    the page itself is 800x416.

    The panel is 7 inches at ~133 dpi and is read at arm's length in a moving
    car, so this is a glance instrument: nothing read while driving is under 18 px (20 px
    for Chinese), state is carried by thick blocks of colour, and the only
    text on a gauge is the "1g" that names the ring of the friction circle.

    Three views, chosen automatically from the driving state. Each one shows
    everything its situation needs, so that no input is ever required to find
    a value:
        STANDBY  standing still (3 s): coolant, huge, with its state in a word
                 (COLD / WARMING / NORMAL / HOT / OVERHEAT), gear, rpm number
                 and bar, outside temperature; in the strip the session timer,
                 the session's peak g, and green / grey / red tell-tales for
                 oil pressure and charging
        STREET   moving: speed, huge, gear, rpm bar; in the strip coolant
                 (number and colour bar) and outside temperature
        TRACK    above 0.55 g or 5500 r/min for 0.8 s; left again after 12 s
                 below 0.3 g and 4000 r/min. Friction circle with trail and
                 peak marks, the pedals right beside it (brake red, throttle
                 green), g now and peak g; speed, gear, rpm bar and number,
                 coolant; in the strip GPS speed, steering angle, session timer

    Warnings (oil pressure, charging, coolant above 112 C) take over the
    bottom strip as red blocks in every view and light a red bar along the top
    edge. They blink at 1 Hz for five seconds, then stay lit. Oil and charging
    are ignored while the engine is known to be stopped, when both lamps are
    lit on any car. Nothing on this page flashes faster than 3 Hz.

    Data: /tmp/nd2cn/dashboard.json, written ~20x per second by
    dashboard-daemon.sh. Every value may be null, and two of them matter on
    firmware 74.00.324A: outside temperature has no source there, so
    "ambient" is always null and its cell stays hidden; coolant is not on
    D-Bus and is read from the shared memory database every 2 s. Should that
    fail, coolant shows "--" and no state word, and the over-temperature
    warning cannot fire; everything else carries on. The gear comes as
    "gear" (manual), "lever" (automatic) and "gearbox", see gearText(). After 0.6 s without a new
    sample the values turn grey (NO DATA), after 2 s they are blanked
    (OFFLINE). The page never writes anything anywhere; all state lives in
    memory and is gone at power-off.

    URL options (after #, separated by &):
        demo        synthetic data, no daemon needed (bench testing)
        raw         open the calibration panel at start
        view=track  start locked in one view (standby | street | track)
        alert       with demo: show the warning blocks
        lang=zh_CN  force the label language (normally taken from the system)
        data=URL    read the JSON from another URL

    Controls. Every commander input has one meaning in every state, so it can
    be worked without looking. Touch does the same things.
        rotate          / swipe left-right    next / previous view, locked
        tilt up                               TRACK view, now, locked
        tilt down       / tap the status cell back to automatic
        press, press    / tap, tap            reset peak g and timer (the first
                                              press asks, 3 s to confirm)
        Back            / tap  <              close
        tilt left-right / tap the status cell calibration panel on / off;
                          (while automatic)   it only opens standing still
-->
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Track Dash</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 800px; height: 416px;
    overflow: hidden;
    background: #050707;
}
body {
    color: #ffffff;
    font-family: "Tipperary", Arial, Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1;
    cursor: default;
}
#app {
    position: absolute; left: 0; top: 0;
    width: 800px; height: 416px;
    overflow: hidden;
    /* the factory wallpaper, shifted up by the status bar height */
    background: #050707 url("file:///jci/gui/common/images/background.png") 0 -64px no-repeat;
}
#veil  { position: absolute; left: 0; top: 0; width: 800px; height: 416px; background: rgba(4, 7, 7, 0.62); }
#strip { position: absolute; left: 0; top: 336px; width: 800px; height: 78px;
         background: rgba(0, 0, 0, 0.46); border-top: 2px solid rgba(255, 255, 255, 0.10); }
#app div, #app span, #app canvas { position: absolute; }
#app span.s, #app span.d, #app span.p, #app span.al { position: static; }

/* which view shows what: vT = track, vS = street, vB = standby */
#app .vT, #app .vS, #app .vB { display: none; }
#app.m-track .vT, #app.m-street .vS, #app.m-standby .vB { display: block; }

/* section label. Chinese is set larger than English: a hanzi has more strokes
   than a capital letter and needs the extra pixels at the same distance. */
.lb { height: 24px; line-height: 24px; font-size: 20px; letter-spacing: 2px; color: #b4b7ba; white-space: nowrap; }
.en .lb { font-size: 18px; }

/* numbers: every glyph sits in a fixed-width cell (tabular figures) */
.num  { white-space: nowrap; font-weight: bold; }
.d    { display: inline-block; width: 0.58em; text-align: center; }
.p    { display: inline-block; width: 0.32em; text-align: center; }
.unit { font-size: 18px; font-weight: normal; color: #b4b7ba; letter-spacing: 1px; white-space: nowrap; margin-left: 6px; }

.cWhite { color: #ffffff; }
.cDim   { color: #55585a; }
.cCold  { color: #5aa8ff; }
.cAmber { color: #f89c1e; }
.cRed   { color: #ff2801; }

/* Samples stopped arriving (but not yet for long enough to blank the
   screen): what is shown is old, so it loses its white. */
#app.stale #spdV, #app.stale #rpmV, #app.stale #gearV, #app.stale #coolV,
#app.stale #gTotV, #app.stale #gpsV, #app.stale #stV, #app.stale #ambV { color: #7d8083; }

/* ── friction circle ── */
#gBg, #gFg { left: 12px; top: 4px; }
#gTot  { left: 16px; top: 266px; width: 170px; height: 60px; white-space: nowrap; }
#gTotV { font-size: 56px; line-height: 60px; }
#gTot .unit { font-size: 24px; }
#gMaxL { left: 222px; top: 266px; width: 120px; text-align: right; }
#gMax  { left: 222px; top: 291px; width: 120px; height: 34px; text-align: right; font-size: 32px; line-height: 34px; }

/* ── pedals: right beside the circle, so that what the feet do and what
      the car does with it are read in one glance ── */
#ped   { left: 284px; top: 14px; }

/* ── engine speed bar: top right (track), full width (street), under the
      rpm number (standby) ── */
#rpm { left: 360px; top: 14px; }

/* ── speed, gear ── */
#spdL { left: 360px; top: 68px; }
#spdV { left: 360px; top: 90px; width: 216px; height: 120px; text-align: right;
        font-size: 120px; line-height: 120px; }
#spdU { left: 580px; top: 180px; font-size: 20px; }
#gearBox { left: 644px; top: 72px; width: 140px; height: 142px; background: rgba(255, 255, 255, 0.07); }
#gearL   { left: 0; top: 7px; width: 140px; text-align: center; text-indent: 2px; }
#gearV   { left: 0; top: 30px; width: 140px; height: 104px; text-align: center;
           font-size: 104px; line-height: 104px; font-weight: bold; }
#gearAcc { left: 0; top: 136px; width: 140px; height: 6px; background: #55585a; }

/* ── rpm number, coolant ── */
#rpmL  { left: 360px; top: 228px; }
#rpmBox  { left: 360px; top: 254px; width: 200px; height: 56px; white-space: nowrap; }
#rpmV    { font-size: 52px; line-height: 56px; }
#coolL { left: 572px; top: 228px; }
#coolBox { left: 624px; top: 222px; width: 160px; height: 46px; text-align: right; white-space: nowrap; }
#coolV   { font-size: 40px; line-height: 46px; }
#coolBox .unit { font-size: 20px; }
#cool  { left: 572px; top: 278px; }
#coolS { display: none; }

/* ── bottom strip ── */
.cell { top: 336px; height: 80px; }
.cl   { left: 0; top: 10px; }
.cv   { left: 0; top: 38px; height: 36px; font-size: 32px; line-height: 36px; white-space: nowrap; }
#sesCell { left: 504px; width: 150px; }
#stDot { left: 0; top: 16px; width: 12px; height: 12px; background: #55585a; }
#stTxt { left: 22px; top: 10px; height: 24px; font-size: 18px; line-height: 24px; letter-spacing: 2px; white-space: nowrap; }
#stSub { left: 22px; top: 40px; height: 24px; font-size: 18px; line-height: 24px; color: #b4b7ba; white-space: nowrap; }
.zh #stTxt, .zh #stSub { font-size: 20px; }
#lockC { left: -2px; top: 41px; display: none; }
/* oil pressure and charging, standby only: a green square says "fine"
   without a word being read; grey = engine not running, red = fault */
.ttD { left: 0; width: 12px; height: 12px; background: #55585a; }
.ttT { left: 22px; height: 24px; font-size: 18px; line-height: 24px; color: #b4b7ba; white-space: nowrap; }
.zh .ttT { font-size: 20px; }

/* ── calibration panel (used parked, so it may be denser) ── */
#raw  { left: 8px; top: 4px; width: 340px; height: 328px; display: none; background: #070a0a; }
#rawT { left: 10px; top: 6px; color: #ffffff; }
.rr { left: 10px; width: 320px; height: 18px; font-size: 16px; line-height: 18px; }
.rn { left: 0; color: #b4b7ba; white-space: nowrap; }
.ra { left: 118px; width: 80px; text-align: right; color: #c8c8c8; white-space: nowrap; }
.rb { left: 202px; width: 118px; text-align: right; color: #ffffff; white-space: nowrap; }

/* ── view change: a short dip to dark instead of a hard cut ── */
#fade { left: 0; top: 0; width: 800px; height: 336px; display: none; background: #050707; }

/* ── warnings: red blocks that take over the bottom strip in every view,
      plus a red bar along the top edge, the part of the screen closest to
      the road. They never cover speed, gear or the rpm bar; what they do
      cover (GPS speed, steering, timer) does not matter while one is up. ── */
#alTop  { left: 0; top: 0; width: 800px; height: 10px; display: none; background: #ff2801; }
#alerts { left: 76px; top: 338px; width: 572px; height: 78px; padding-left: 8px; display: none;
          background: #050707; white-space: nowrap; }
.al { display: none; vertical-align: top; margin: 9px 8px 0 0; height: 60px; padding: 0 20px;
      background: #ff2801; color: #ffffff;
      font-size: 30px; line-height: 60px; font-weight: bold; letter-spacing: 3px; }

/* ── feedback for the commander: also in the strip, never over the gauges ── */
#toast { left: 344px; top: 346px; width: 310px; height: 62px; display: none;
         background: #0b3a45; color: #ffffff; font-weight: bold;
         text-align: center; font-size: 22px; line-height: 62px; letter-spacing: 2px; white-space: nowrap; }
#toast.ask { background: #f89c1e; color: #140d02; }

/* ── STREET: speed is the whole screen; coolant and outside temperature
      sit in the strip ── */
.m-street #rpm     { left: 20px; }
.m-street #spdL    { left: 96px; top: 84px; width: 420px; text-align: right; }
.m-street #spdV    { left: 96px; top: 100px; width: 420px; height: 210px; font-size: 210px; line-height: 210px; }
.m-street #spdU    { left: 526px; top: 260px; font-size: 24px; }
.m-street #gearBox { left: 630px; top: 100px; width: 150px; height: 208px; }
.m-street #gearL   { width: 150px; top: 12px; }
.m-street #gearV   { width: 150px; top: 42px; height: 154px; font-size: 150px; line-height: 154px; }
.m-street #gearAcc { width: 150px; top: 202px; }
.m-street #coolL   { left: 84px; top: 346px; }
.m-street #coolBox { left: 84px; top: 374px; width: 150px; height: 36px; text-align: left; }
.m-street #coolV   { font-size: 32px; line-height: 36px; }
.m-street #coolBox .unit { font-size: 18px; }
.m-street #cool    { left: 236px; top: 362px; }
.m-street #ambCell { left: 504px; top: 336px; width: 150px; height: 80px; }

/* ── STANDBY: warming up, pit lane. Two modules of the same build:
      coolant number over coolant bar, gear and rpm number over rpm bar.
      The strip holds what one looks at after a session. ── */
.m-standby #coolL   { left: 44px; top: 24px; }
.m-standby #coolBox { left: 40px; top: 52px; width: 420px; height: 190px; text-align: left; }
.m-standby #coolV   { font-size: 180px; line-height: 190px; }
.m-standby #coolBox .unit { font-size: 32px; margin-left: 10px; }
.m-standby #cool    { left: 44px; top: 258px; }
.m-standby #coolS   { display: block; left: 220px; top: 22px; width: 220px; height: 28px; text-align: right;
                      font-size: 24px; line-height: 28px; font-weight: bold; letter-spacing: 2px; white-space: nowrap; }
.m-standby #gearBox { left: 480px; top: 24px; width: 132px; height: 212px; }
.m-standby #gearL   { width: 132px; top: 10px; }
.m-standby #gearV   { width: 132px; top: 44px; height: 150px; font-size: 140px; line-height: 150px; }
.m-standby #gearAcc { width: 132px; top: 206px; }
.m-standby #rpmL    { left: 636px; top: 24px; }
.m-standby #rpmBox  { left: 634px; top: 50px; width: 150px; }
.m-standby #rpmBox .unit { display: none; }     /* no room, and the label says it */
.m-standby #rpm     { left: 480px; top: 258px; }
.m-standby #ambCell { left: 636px; top: 146px; width: 148px; height: 90px; }
.m-standby #ambCell .cv { height: 44px; font-size: 40px; line-height: 44px; }
.m-standby #sesCell { left: 84px; }
</style>
</head>
<body>
<div id="app">
    <div id="veil"></div>
    <div id="strip"></div>

    <!-- ── left: friction circle ── -->
    <canvas id="gBg" class="vT" width="260" height="260"></canvas>
    <canvas id="gFg" class="vT" width="260" height="260"></canvas>
    <div id="gTot" class="vT"><span id="gTotV" class="num s"></span><span class="unit s">g</span></div>
    <div id="gMaxL" class="lb vT" data-l="max"></div>
    <div id="gMax" class="num vT"></div>

    <!-- ── engine speed bar (every view) ── -->
    <canvas id="rpm" width="424" height="44"></canvas>

    <!-- ── speed, gear, pedals ── -->
    <div id="spdL" class="lb vT vS" data-l="speed"></div>
    <div id="spdV" class="num vT vS"></div>
    <span id="spdU" class="unit vT vS">km/h</span>

    <div id="gearBox">
        <div id="gearL" class="lb" data-l="gear"></div>
        <div id="gearV"></div>
        <div id="gearAcc"></div>
    </div>

    <canvas id="ped" class="vT" width="58" height="250"></canvas>

    <!-- ── rpm number, coolant ── -->
    <div id="rpmL" class="lb vT vB" data-l="rpm"></div>
    <div id="rpmBox" class="vT vB"><span id="rpmV" class="num s"></span><span class="unit s">r/min</span></div>

    <div id="coolL" class="lb" data-l="cool"></div>
    <div id="coolS"></div>
    <div id="coolBox"><span id="coolV" class="num s"></span><span class="unit s">&deg;C</span></div>
    <canvas id="cool" width="212" height="26"></canvas>

    <!-- ── bottom strip ── -->
    <canvas id="back" class="cell" width="64" height="80" style="left:0"></canvas>

    <div class="cell vT" style="left:84px;width:200px">
        <div class="lb cl" data-l="gps"></div>
        <div class="cv"><span id="gpsV" class="num s"></span><span class="unit s">km/h</span></div>
    </div>

    <div class="cell vT" style="left:296px;width:196px">
        <div class="lb cl" data-l="steer"></div>
        <div class="cv"><span id="stV" class="num s"></span></div>
        <canvas id="stC" width="96" height="24" style="left:96px;top:44px"></canvas>
    </div>

    <div class="cell vT vB" id="sesCell">
        <div class="lb cl" data-l="ses"></div>
        <div class="cv"><span id="sesV" class="num s"></span></div>
    </div>

    <div class="cell vB" style="left:296px;width:196px">
        <div class="lb cl" data-l="peakg"></div>
        <div class="cv"><span id="pkV" class="num s"></span><span class="unit s">g</span></div>
    </div>

    <div class="cell vB" style="left:504px;width:150px">
        <div id="ttOilD" class="ttD" style="top:16px"></div><div id="ttOilT" class="ttT" style="top:10px"></div>
        <div id="ttBatD" class="ttD" style="top:46px"></div><div id="ttBatT" class="ttT" style="top:40px"></div>
    </div>

    <div class="cell" id="stCell" style="left:664px;width:136px">
        <div id="stDot"></div>
        <div id="stTxt"></div>
        <canvas id="lockC" width="16" height="20"></canvas>
        <div id="stSub"></div>
    </div>

    <!-- ── outside temperature (street: strip, standby: beside the gear) ── -->
    <div id="ambCell" class="vS vB">
        <div class="lb cl" data-l="amb"></div>
        <div class="cv"><span id="ambV" class="num s"></span><span class="unit s">&deg;C</span></div>
    </div>

    <div id="fade"></div>

    <div id="alTop"></div>
    <div id="alerts"><span id="alOil" class="al"></span><span id="alBat" class="al"></span><span id="alTmp" class="al"></span></div>

    <!-- ── calibration panel (hidden) ── -->
    <div id="raw">
        <div class="lb" id="rawT" data-l="raw"></div>
        <div id="rawRows" style="left:0;top:34px;width:340px;height:290px"></div>
    </div>

    <div id="toast"></div>
</div>

<script type="text/javascript">
(function () {
    var W = window, D = document;

    // ─────────────────────────────────────────────────────────────
    // Configuration
    // ─────────────────────────────────────────────────────────────
    var CFG = {
        dataUrl:    "file:///tmp/nd2cn/dashboard.json",
        pollMs:     50,      // data poll period (the daemon writes at 20 Hz)
        softMs:     600,     // no new sample for this long -> values turn grey
        staleMs:    2000,    // ... and for this long -> OFFLINE, values blank

        rpmMax:     8000,    // right end of the bar
        rpmAmber:   6000,    // blocks from here up are amber
        rpmRed:     7000,    // blocks from here up are red
        rpmWarn:    6500,    // the whole bar turns amber
        rpmRedline: 7500,    // ND2 2.0 redline: the whole bar flashes red
        rpmFlashMs: 170,     // half period of that flash. Keeps it under three
                             // flashes a second, the limit for large flashing
                             // areas (and for red in particular)

        gRing:      1.25,    // g at the outer ring
        gClamp:     1.30,    // the dot never leaves the plate
        gBall:      true,    // true: the dot moves like a ball on the dashboard
                             //       (braking = up, right-hand corner = left)
                             // false: engineering g-g plot
                             //       (acceleration = up, right-hand corner = right)
        gSane:      2.5,     // samples above this are glitches, not peaks
        trailMs:    4000,    // length of the fading trail

        coolMin:    40,      // coolant bar range, deg C
        coolMax:    130,
        coolCold:   60,      // below: COLD
        coolReady:  80,      // below: WARMING, still blue; from here green, NORMAL
        coolWarn:   105,     // amber, HOT
        coolCrit:   112,     // red, OVERHEAT, and a warning block

        steerFull:  180,     // steering indicator full scale, degrees

        // Automatic view selection. A view change moves everything on the
        // screen, so it must not happen in ordinary traffic: a firm stop at
        // a light reaches 0.4 g and a motorway slip road 5000 r/min, hence
        // the thresholds sit above both and must hold for a moment.
        moveKmh:      5,     // above: STREET (back to STANDBY below stopKmh)
        stopKmh:      3,
        trackG:       0.55,  // combined g that enters TRACK
        trackRpm:     5500,  // ... or this engine speed
        trackStayG:   0.3,   // lower thresholds that keep TRACK once entered
        trackStayRpm: 4000,
        streetMs:     500,   // moving this long          -> STREET
        standbyMs:    3000,  // standing this long        -> STANDBY (not at every stop line)
        trackEnterMs: 800,   // above the thresholds      -> TRACK
        trackExitMs:  12000, // below the stay thresholds -> leave TRACK; long,
                             // so the layout does not flip in a slow corner

        // warnings
        engineRpm:    400,   // below: engine not running. The oil and charge
                             // lamps are lit then on every car; not a fault.
        warnHoldMs:   1000,  // a warning must last this long before it shows
        warnBlinkMs:  5000,  // it blinks at 1 Hz this long, then stays steady

        resetArmMs:   3000,  // the second press that resets must come this soon
        fadeMs:       160    // dip to dark when the view changes
    };

    var C_CYAN = "#3cc8e8", C_AMBER = "#f89c1e", C_RED = "#ff2801", C_GREEN = "#3ecf6e", C_BLUE = "#3d8bff";
    var C_OFF = "#55585a", C_LABEL = "#b4b7ba";
    var C_RED_LOW = "#8f1600";                 // the dark half of every red blink
    var TAU = Math.PI * 2;
    var DASH = "-";

    var OPT = { demo: false, raw: false, lang: "", view: "", alert: false };
    (function () {
        var h = String(W.location.hash || "").replace(/^#/, "").split("&"), i, kv;
        for (i = 0; i < h.length; i++) {
            kv = h[i].split("=");
            if (kv[0] === "demo") { OPT.demo = true; }
            else if (kv[0] === "raw") { OPT.raw = true; }
            else if (kv[0] === "lang" && kv[1]) { OPT.lang = kv[1]; }
            else if (kv[0] === "view" && kv[1]) { OPT.view = kv[1]; }
            else if (kv[0] === "alert") { OPT.alert = true; }
            else if (kv[0] === "data" && kv[1]) { CFG.dataUrl = decodeURIComponent(kv.slice(1).join("=")); }
        }
    })();

    // ─────────────────────────────────────────────────────────────
    // Language: Chinese labels when the system language is zh_CN, English
    // otherwise (and when the page is opened on its own). The page runs in
    // an iframe, so the GUI framework lives in the parent window; the loader
    // also passes the language in the URL in case the parent is off limits.
    // ─────────────────────────────────────────────────────────────
    var lang = "en";
    (function () {
        var fw = null;
        if (OPT.lang) { lang = OPT.lang === "zh_CN" ? "zh_CN" : "en"; return; }
        try { fw = W.framework || W.parent.framework; } catch (e) {}
        try { if (fw && fw.localize && fw.localize.getCurrLang() === "zh_CN") { lang = "zh_CN"; } } catch (e2) {}
    })();
    var ZH = lang === "zh_CN";
    var LABELS = ZH ? {
        speed: "车速", gear: "挡位", rpm: "转速", cool: "水温", max: "峰值", peakg: "峰值 G",
        gps: "GPS 车速", steer: "转向角", ses: "计时", amb: "车外温度", raw: "校准"
    } : {

        var o = S.obj || {}, r = o.raw || {}, i, ka, kb, a, b;
        for (i = 0; i < RAW_ROWS.length; i++) {
            ka = RAW_ROWS[i][0]; kb = RAW_ROWS[i][1];
            a = ka === null ? "" : (ka === "#seq" ? show(o.seq) : (ka === "#sig" ? show(o.sig) : show(r[ka])));
            b = kb === null ? "" : (kb === "#age" ? (S.lastChange ? (now - S.lastChange) + " ms" : DASH) : show(o[kb]));
            if (kb === "hz") { b = show(o.hz) + " / " + Math.round(fps) + " fps"; }
            if (kb === "#warn") { b = show(o.oil_warn) + " / " + show(o.batt_warn); }
            if (kb === "#gear") { b = gearText(o.gear, o.lever, o.gearbox); }       // what the gear box shows
            setText(rawEls[i][0], a);
            setText(rawEls[i][1], b);
        }
    }
    function toggleRaw(on) {
        var c = S.cur;
        if (on === undefined) {
            on = !rawOn;
            // It covers the friction circle, so it only opens standing still.
            // Once open it stays, for a passenger checking the g scale.
            if (on && live && c && c.speed !== null && c.speed > CFG.moveKmh) { toast(TXT.parked); return; }
        }
        rawOn = on;
        if (rawOn && rawEls.length === 0) { buildRaw(); }
        el.raw.style.display = rawOn ? "block" : "none";
        if (rawOn) { updateRaw(Date.now()); }
    }

    // ─────────────────────────────────────────────────────────────
    // Frame loop
    // ─────────────────────────────────────────────────────────────
    var raf = W.requestAnimationFrame || W.oRequestAnimationFrame || W.webkitRequestAnimationFrame ||
              W.mozRequestAnimationFrame || W.msRequestAnimationFrame ||
              function (cb) { return W.setTimeout(cb, 16); };
    var F = { last: 0, fast: 0, med: 0, slow: 0, ema: 16, slowSince: 0, okSince: 0, skip: false, drew: false };

    // bars follow the data while live and fall back to zero when it stops
    function follow(key, target, dt) {
        if (target === null) {
            shown[key] *= Math.pow(0.5, dt / 90);
            if (shown[key] < 0.5) { shown[key] = 0; }
        } else {
            shown[key] = target;
        }
    }
    // Presto draws the canvas in software. If frames get slow, drop the trail
    // glow first, then halve the frame rate; recover when there is headroom.
    function adaptQuality(now, dt) {
        F.ema += (dt - F.ema) * 0.05;
        fps = 1000 / Math.max(1, F.ema);
        if (F.ema > 30) {
            F.okSince = now;
            if (!F.slowSince) { F.slowSince = now; }
            if (now - F.slowSince > 2500 && quality > 0) { quality--; F.slowSince = now; }
        } else {
            F.slowSince = 0;
            if (!F.okSince) { F.okSince = now; }
            if (F.ema < 19 && now - F.okSince > 20000 && quality < 2) { quality++; F.okSince = now; }
        }
    }
    function frame() {
        var now = Date.now(), dt = F.last ? now - F.last : 16, sample = F.drew, state;
        raf(frame);
        if (dt < 0 || dt > 1000) { dt = 16; }         // clock jumped (GPS time sync)
        F.last = now;
        // dt is the interval since the previous callback, i.e. the time that
        // callback took. Only an interval in which a frame was rendered says
        // anything about render cost: at quality 0 the interval after a
        // skipped frame costs ~0 ms and would drag F.ema down (quality 0 <-> 1
        // oscillation). Measuring render-to-render instead would span a skip
        // plus a render (>= 2 timer periods), so quality 0 could never recover.
        if (sample) { adaptQuality(now, dt); }
        F.drew = false;
        if (quality === 0) {                          // slow unit: draw every other frame
            F.skip = !F.skip;
            if (F.skip) { return; }
        }
        F.drew = true;

        if (S.lastChange > now) { S.lastChange = now; S.tCur = now; }
        if (!S.cur) {
            state = (now - T0 < 2500) ? "wait" : "offline";
        } else if (now - S.lastChange > CFG.staleMs) {
            state = "offline";
        } else if (S.cur.idle) {
            state = "idle";
        } else {
            // the daemon writes 20 times a second; half a second of silence
            // means the numbers on screen can no longer be trusted
            state = now - S.lastChange > CFG.softMs ? "stale" : "live";
        }
        live = state === "live" || state === "stale";
        if (stale !== (state === "stale")) { stale = state === "stale"; appClass(); }
        if (live) { interpolate(now, V); }

        follow("rpm", live ? V.rpm : null, dt);
        follow("thr", live ? V.throttle : null, dt);
        follow("brk", live ? V.brake : null, dt);

        autoMode(now);
        fadeStep(now);
        if (M.mode === "track") {
            drawGBg();
            drawG(now);
            drawPedals();
            drawSteer();
        }
        drawRpm(now);
        drawCool(now);

        if (now - F.fast >= 50 || now < F.fast) { F.fast = now; updateFast(); updateAlerts(now); }
        if (now - F.med >= 200 || now < F.med) { F.med = now; updateMed(); }
        if (now - F.slow >= 250 || now < F.slow) { F.slow = now; updateSlow(now, state); }
    }

    // ─────────────────────────────────────────────────────────────
    // Input
    // ─────────────────────────────────────────────────────────────
    // Every input has one meaning, whatever the state, so the commander can
    // be worked without looking at the screen.
    function onKey(k) {
        if (k === "select") { press(); }
        else if (k === "cw") { cycleMode(1); }
        else if (k === "ccw") { cycleMode(-1); }
        else if (k === "up") { jumpTo("track"); }
        else if (k === "down") { unlock(); }
        else if (k === "left" || k === "right") { toggleRaw(); }
    }
    W.addEventListener("message", function (e) {
        var d = e ? e.data : null;
        if (typeof d !== "string" || d.indexOf("nd2cn-dash:") !== 0) { return; }
        d = d.substring(11);
        if (d.indexOf("key:") === 0) { onKey(d.substring(4)); }
        else if (d.indexOf("init:") === 0) { loadState(d.substring(5)); }
    }, false);

    // Touch mirrors the commander.
    //   swipe left / right   next / previous view, locked   = commander rotate
    //   tap  <               close                          = commander Back
    //   tap status cell      locked: back to automatic      = commander tilt down
    //                        automatic: calibration         = commander tilt left / right
    //   tap the panel        close it
    //   tap anywhere else    reset peaks (asks first)       = commander press
    (function () {
        var downX = null;
        function tap(n) {
            var id;
            while (n && n !== app) {
                id = n.id;
                if (id === "back") {
                    if (W.parent && W.parent !== W) { post("close"); }
                    else { try { W.history.back(); } catch (err) {} }
                    return;
                }
                if (id === "stCell" && M.lock) { unlock(); return; }
                if (id === "stCell" || id === "raw") { toggleRaw(); return; }
                n = n.parentNode;
            }
            press();
        }
        app.onmousedown = function (e) { downX = (e || W.event).clientX; };
        app.onmouseup = function (e) {
            var ev = e || W.event, dx;
            if (downX === null) { return; }
            dx = ev.clientX - downX;
            downX = null;
            if (dx <= -60) { cycleMode(1); }
            else if (dx >= 60) { cycleMode(-1); }
            else { tap(ev.target || ev.srcElement); }
        };
    })();
    D.onselectstart = function () { return false; };

    // ─────────────────────────────────────────────────────────────
    // Start
    // ─────────────────────────────────────────────────────────────
    applyLabels();
    V = blank();
    setMode("standby");
    if (OPT.view === "standby" || OPT.view === "street" || OPT.view === "track") { M.lock = true; setMode(OPT.view); }
    AL.oil.el.textContent = TXT.oil;
    AL.bat.el.textContent = TXT.batt;
    $("ttOilT").textContent = TXT.ttOil;
    $("ttBatT").textContent = TXT.ttBat;
    drawBack();
    drawLock();
    if (OPT.raw) { toggleRaw(true); }
    updateFast();
    updateMed();
    updateAlerts(Date.now());
    updateSlow(Date.now(), "wait");
    if (OPT.demo) { demoTick(); } else { poll(); }
    raf(frame);
    post("ready");
})();
</script>
</body>
</html>
